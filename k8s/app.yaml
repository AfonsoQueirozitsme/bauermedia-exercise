apiVersion: apps/v1
kind: Deployment
metadata:
  name: bauermedia-app
  labels:
    app: bauermedia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bauermedia
  template:
    metadata:
      labels:
        app: bauermedia
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: bauermedia-service
spec:
  selector:
    app: bauermedia
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: NodePort
